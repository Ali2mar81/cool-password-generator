<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/3256/3256783.png">
    <!-- <link rel="stylesheet" href="./style.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-w-screen flex items-center min-h-screen bg-cover bg-center bg-no-repeat"
    style="background-image: url('./image/wallpaper-8257343_1280.png');"
>
    <div class="p-4 mx-auto md:p-0">
        <div class="max-w-[700px] mx-auto shadow-[0px_0px_17px_0px_#87bdff] backdrop-blur-sm rounded-lg p-2 space-y-6">
                <h1 class="font-mono px-2 py-4 shadow-[inset_0px_4px_12px_-4px_rgba(0,_0,_0,_0.3)] rounded-lg text-center">
                    <span class="text-indigo-700 font-bold">Cool</span> <span class="font-bold  ">Password</span> <span class="text-purple-600">Generator</span>  
                </h1>
                
                <div id="selection_area" class="px-2 space-y-3">
                    <div class="w-full flex gap-2">
                        <label for="pass_len" >
                            Password Length: 
                        </label>
                        <input type="text" id="pass_len" class="flex-1 ring rounded-lg ring-indigo-600 outline-none indent-3">
                    </div>
                    <h2 class="text-center font-semibold text-gray-600">Select the elements you want to include in your password.</h2>
                    <div class="sm:grid sm:grid-cols-2">
                        <div class="flex flex-row items-center gap-2">
                            <input type="checkbox" id="lower" />
                            <label for="lower" class="font-medium">
                                Lowercase Characters
                            </label>
                        </div>
                        <div class="flex flex-row items-center gap-2">
                            <input type="checkbox" id="upper" />
                            <label for="upper" class="font-medium">
                                Uppercase Characters
                            </label>
                        </div>
                        <div class="flex flex-row items-center gap-2">
                            <input type="checkbox" id="numbers" />
                            <label for="numbers" class="font-medium">
                                Numbers
                            </label>
                        </div>
                        <div class="flex flex-row items-center gap-2">
                            <input type="checkbox" id="symbols" />
                            <label for="symbols" class="font-medium ">
                                Symbols
                            </label>
                        </div>
                    </div>
                </div>
                <button class="transition-all duration-300 ease-linear w-full bg-indigo-400 text-white py-2 rounded-lg cursor-pointer hover:bg-indigo-600 hover:shadow-[inset_0px_4px_12px_-4px_rgba(255,_255,_255,_0.3)]" id="btngen">Generate</button>
                <div class="flex flex-col gap-4 items-end">
                    <div class="" id="copy">
                        <span id="status" class="hidden bg-gray-200 p-2 rounded-lg font-semibold text-green-600 transition-transform duration-200"></span>
                        <button class="disabled:bg-gray-400 disabled:cursor-not-allowed ease-linear cursor-pointer p-2 bg-indigo-400 rounded-xl font-semibold text-white hover:bg-indigo-600 hover:shadow-[inset_0px_4px_12px_-4px_rgba(255,_255,_255,_0.3)] transition-all duration-300" id="copybtn" >Copy</button>
                    </div>
                    <div class="hidden flex-wrap w-full shadow-[inset_0px_4px_12px_-4px_rgba(0,_0,_0,_0.3)] p-2 rounded-lg text-indigo-700 bg-slate-100" id="result">
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
